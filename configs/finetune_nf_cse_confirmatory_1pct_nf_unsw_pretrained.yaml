workflow: finetune
experiment:
  name: schemaflow-nf-cse-confirmatory-1pct-nf-unsw-pretrained
  output_root: /root/autodl-tmp/Res-AE-Attn/results
  seed: 17
  enforce_autodl_data_disk: true
schema:
  version: nf-cse-cic-ids2018-v2-model-41-v1
runtime:
  device: cuda
  execution: train
data:
  dataset_id: NF-CSE-CIC-IDS2018-v2
  split_dir: /root/autodl-tmp/Res-AE-Attn/data/splits/NF-CSE-CIC-IDS2018-v2/few-shot-train-1pct-seed17-from-confirmatory-1m-v1
  preprocessor_dir: /root/autodl-tmp/Res-AE-Attn/data/preprocessing/NF-CSE-CIC-IDS2018-v2/train-only-confirmatory-1pct-seed17-v1
  data_manifest: /root/autodl-tmp/Res-AE-Attn/repository/manifests/datasets/NF-CSE-CIC-IDS2018-v2.source.json
model:
  name: schemaflow_fm_supervised
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 512
  dropout: 0.1
  adapter_dim: 32
training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.01
  gradient_clip: 1.0
  scheduler_gamma: 0.98
  shuffle: true
  class_balance: inverse_frequency
  evaluation_scope: validation_only
  loss_weights:
    binary: 1.0
    coarse: 1.0
    native: 1.0
