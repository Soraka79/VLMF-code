workflow: finetune
experiment:
  name: schemaflow-nf-ton-few-shot-1pct-multisource-pretrained-pilot
  output_root: /root/autodl-tmp/Res-AE-Attn/results
  seed: 17
  enforce_autodl_data_disk: true
schema:
  version: nf-ton-iot-v2-model-41-v1
runtime:
  device: cuda
  execution: train
data:
  dataset_id: NF-ToN-IoT-v2
  split_dir: /root/autodl-tmp/Res-AE-Attn/data/splits/NF-ToN-IoT-v2/few-shot-train-1pct-seed42-from-f4326cf
  preprocessor_dir: /root/autodl-tmp/Res-AE-Attn/data/preprocessing/NF-ToN-IoT-v2/train-only-few-shot-1pct-seed42-from-f4326cf
  data_manifest: /root/autodl-tmp/Res-AE-Attn/repository/manifests/datasets/NF-ToN-IoT-v2.source.json
model:
  name: schemaflow_fm_supervised
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 512
  dropout: 0.1
  adapter_dim: 32
training:
  epochs: 20
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip: 1.0
  scheduler_gamma: 0.95
  shuffle: true
  class_balance: inverse_frequency
  loss_weights:
    binary: 1.0
    coarse: 1.0
    native: 1.0
